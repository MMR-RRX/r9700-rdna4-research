<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Zombie Outbreak 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; font-family: monospace; }
  #hud { position: fixed; top: 10px; left: 10px; color: #0f0; font-size: 18px;
         text-shadow: 0 0 6px #0f0; z-index: 10; pointer-events: none; }
  #crosshair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
         color: #f00; font-size: 24px; z-index: 10; pointer-events: none; }
  #msg { position: fixed; top: 40%; width: 100%; text-align: center; color: #f33;
         font-size: 42px; text-shadow: 0 0 10px #f00; z-index: 10; display: none; }
  #msg button { font-size: 20px; padding: 8px 20px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="crosshair">+</div>
<div id="msg"><div id="msgText"></div><button onclick="restart()">Play Again</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
let scene, camera, renderer, clock;
let player, zombies = [], bullets = [], health = 100, score = 0, alive = true;
let yaw = 0, pitch = 0, keys = {}, spawnTimer = 0, shootCooldown = 0;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 10, 60);
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 200);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  clock = new THREE.Clock();

  // Lights
  scene.add(new THREE.AmbientLight(0x404050, 1.2));
  const moon = new THREE.DirectionalLight(0x8899ff, 0.8);
  moon.position.set(10, 20, 5);
  scene.add(moon);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: 0x1a2a1a }));
  ground.rotation.x = -Math.PI/2;
  scene.add(ground);
  const grid = new THREE.GridHelper(100, 50, 0x2a4a2a, 0x1a3a1a);
  grid.position.y = 0.01;
  scene.add(grid);

  // Obstacles (crates)
  const crateMat = new THREE.MeshStandardMaterial({ color: 0x5a4a30 });
  for (let i = 0; i < 20; i++) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), crateMat);
    c.position.set((Math.random()-0.5)*80, 1, (Math.random()-0.5)*80);
    if (c.position.length() < 8) c.position.x += 12;
    scene.add(c);
  }

  player = new THREE.Object3D();
  player.position.set(0, 1.6, 0);
  scene.add(player);

  // Gun (simple box attached to view)
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.6),
    new THREE.MeshStandardMaterial({ color: 0x222222 }));
  gun.position.set(0.3, -0.25, -0.6);
  camera.add(gun);
  scene.add(camera);

  addEventListener('keydown', e => keys[e.code] = true);
  addEventListener('keyup', e => keys[e.code] = false);
  addEventListener('mousemove', e => {
    if (document.pointerLockElement !== renderer.domElement) return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.4, Math.min(1.4, pitch));
  });
  renderer.domElement.addEventListener('click', () => {
    if (alive) renderer.domElement.requestPointerLock();
  });
  addEventListener('mousedown', e => { if (alive && e.button === 0) shoot(); });
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  animate();
}

function makeZombie() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
  body.position.y = 1.0;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x4a9a4a }));
  head.position.y = 1.9;
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });
  const e1 = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.05), eyeMat);
  e1.position.set(-0.12, 1.95, 0.26);
  const e2 = e1.clone(); e2.position.x = 0.12;
  const armMat = new THREE.MeshStandardMaterial({ color: 0x4a9a4a });
  const a1 = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.9,0.2), armMat);
  a1.position.set(-0.55, 1.2, 0.3); a1.rotation.x = -1.2;
  const a2 = a1.clone(); a2.position.x = 0.55;
  g.add(body, head, e1, e2, a1, a2);
  const angle = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 20;
  g.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
  g.userData = { hp: 3, speed: 1.5 + Math.random() * 1.5, hit: 0 };
  scene.add(g);
  zombies.push(g);
}

function shoot() {
  if (shootCooldown > 0) return;
  shootCooldown = 0.25;
  const ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const meshes = [];
  zombies.forEach(z => z.traverse(o => { if (o.isMesh) { o.userData.zombie = z; meshes.push(o); } }));
  const hits = ray.intersectObjects(meshes);
  if (hits.length > 0) {
    const z = hits[0].object.userData.zombie;
    z.userData.hp--;
    z.userData.hit = 0.15;
    if (z.userData.hp <= 0) killZombie(z);
  }
}

function killZombie(z) {
  score += 10;
  scene.remove(z);
  zombies.splice(zombies.indexOf(z), 1);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (alive) {
    // Player movement
    const speed = keys['ShiftLeft'] ? 12 : 7;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(fwd);
    if (keys['KeyS']) move.sub(fwd);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);
    if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed * dt);
    player.position.add(move);
    player.position.x = Math.max(-48, Math.min(48, player.position.x));
    player.position.z = Math.max(-48, Math.min(48, player.position.z));
    camera.position.copy(player.position);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(yaw);
    camera.rotateX(pitch);

    shootCooldown = Math.max(0, shootCooldown - dt);

    // Spawn zombies
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      makeZombie();
      spawnTimer = Math.max(0.4, 2.5 - score * 0.01);
    }

    // Zombies chase player
    for (const z of zombies) {
      const dir = new THREE.Vector3().subVectors(player.position, z.position);
      dir.y = 0;
      const dist = dir.length();
      dir.normalize();
      z.position.add(dir.multiplyScalar(z.userData.speed * dt));
      z.rotation.y = Math.atan2(dir.x, dir.z);
      z.userData.hit = Math.max(0, z.userData.hit - dt);
      z.traverse(o => { if (o.isMesh && o.material.color)
        o.material.emissive.setHex(z.userData.hit > 0 ? 0xff0000 : 0x000000); });
      if (dist < 1.5) {
        health -= 25 * dt;
        if (health <= 0) gameOver();
      }
    }
  }
  document.getElementById('hud').textContent =
    `HEALTH: ${Math.max(0, Math.ceil(health))}   SCORE: ${score}   ZOMBIES: ${zombies.length}`;
  renderer.render(scene, camera);
}

function gameOver() {
  alive = false;
  document.exitPointerLock();
  document.getElementById('msgText').textContent = 'YOU DIED — SCORE: ' + score;
  document.getElementById('msg').style.display = 'block';
}

function restart() {
  zombies.forEach(z => scene.remove(z));
  zombies = [];
  health = 100; score = 0; alive = true;
  spawnTimer = 1; yaw = 0; pitch = 0;
  player.position.set(0, 1.6, 0);
  document.getElementById('msg').style.display = 'none';
}

init();
</script>
</body>
</html>
