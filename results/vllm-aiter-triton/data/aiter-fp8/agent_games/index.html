<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Zombie Outbreak 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:monospace}
#hud{position:fixed;top:10px;left:10px;color:#8f8;text-shadow:0 0 6px #0f0;font-size:16px;z-index:5;pointer-events:none}
#cross{position:fixed;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:5;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#8f8}
#cross:before{left:8px;top:0;width:2px;height:18px}
#cross:after{top:8px;left:0;width:18px;height:2px}
#msg{position:fixed;top:35%;width:100%;text-align:center;color:#f55;font-size:42px;text-shadow:0 0 12px #f00;z-index:6;pointer-events:none;display:none}
#help{position:fixed;bottom:10px;left:10px;color:#6a6;font-size:12px;z-index:5;pointer-events:none}
</style></head><body>
<div id="hud"></div><div id="cross"></div><div id="msg"></div>
<div id="help">WASD move · Mouse look · Click shoot · R reload · Shift sprint</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0d12);
scene.fog=new THREE.Fog(0x0a0d12,10,90);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x334455,0x111111,1.2));
const moon=new THREE.DirectionalLight(0x8899ff,0.5); moon.position.set(30,50,20); scene.add(moon);
const gunLight=new THREE.PointLight(0xffaa44,0.8,8); scene.add(gunLight);
// ground + grid
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x2a3328}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
const grid=new THREE.GridHelper(200,40,0x334433,0x222b22); grid.position.y=0.01; scene.add(grid);
// crates (obstacles)
const crateMat=new THREE.MeshLambertMaterial({color:0x554433}), crates=[];
for(let i=0;i<25;i++){
  const c=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),crateMat);
  c.position.set((Math.random()-0.5)*160,1,(Math.random()-0.5)*160);
  if(c.position.length()<8)c.position.multiplyScalar(2);
  scene.add(c); crates.push(c);
}
// player state
const P={pos:new THREE.Vector3(),vel:new THREE.Vector3(),yaw:0,pitch:0,hp:100,ammo:12,reserve:60,reloading:false,dead:false};
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='KeyR')reload();});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('mousemove',e=>{
  if(document.pointerLockElement!==renderer.domElement)return;
  P.yaw-=e.movementX*0.0022; P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-e.movementY*0.0022));
});
renderer.domElement.addEventListener('click',()=>{
  if(P.dead){respawn();return;}
  if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();
  else shoot();
});
// gun model attached to camera
const gun=new THREE.Group();
const gBody=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.15,0.5),new THREE.MeshLambertMaterial({color:0x222222}));
const gBarrel=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4),new THREE.MeshLambertMaterial({color:0x111111}));
gBarrel.rotation.x=Math.PI/2; gBarrel.position.set(0,0.05,-0.35);
gun.add(gBody,gBarrel); gun.position.set(0.25,-0.22,-0.5);
const flash=new THREE.PointLight(0xffcc66,0,6); flash.position.set(0,0.05,-0.8);
gun.add(flash); cam.add(gun); scene.add(cam);
let flashT=0;
// tracers
const tracers=[];
function addTracer(a,b){
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),
    new THREE.LineBasicMaterial({color:0xffdd88,transparent:true,opacity:0.9}));
  scene.add(l); tracers.push({l,life:0.08});
}
function shoot(){
  if(P.reloading)return;
  if(P.ammo<=0){reload();return;}
  P.ammo--; flashT=0.06; P.pitch+=0.015; gun.position.z=0; // recoil
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);
  const origin=cam.position.clone();
  let best=null,bestT=1e9; // ray vs zombie head sphere
  for(const z of zombies){
    if(z.dead)continue;
    const c=z.mesh.position.clone(); c.y+=0.9;
    const t=c.sub(origin).dot(dir);
    if(t<0)continue;
    if(origin.clone().addScaledVector(dir,t).distanceTo(c)<0.9&&t<bestT){best=z;bestT=t;}
  }
  const end=best?best.mesh.position.clone().add(new THREE.Vector3(0,0.9,0)):origin.clone().addScaledVector(dir,60);
  addTracer(origin.clone().addScaledVector(dir,0.8),end);
  if(best){best.hp-=34; if(best.hp<=0)killZombie(best);}
  if(P.ammo===0)reload();
}
function reload(){
  if(P.reloading||P.ammo===12||P.reserve<=0)return;
  P.reloading=true;
  setTimeout(()=>{const take=Math.min(12-P.ammo,P.reserve);P.ammo+=take;P.reserve-=take;P.reloading=false;},1200);
}
// zombies
const zombies=[];
const zBodyMat=new THREE.MeshLambertMaterial({color:0x3d6b35}), zHeadMat=new THREE.MeshLambertMaterial({color:0x6b8f4a});
function spawnZombie(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,0.8,4,8),zBodyMat); body.position.y=0.9;
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),zHeadMat); head.position.y=1.8;
  const armL=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.7),zBodyMat);
  armL.position.set(-0.5,1.2,0.3); armL.rotation.x=-1.2;
  const armR=armL.clone(); armR.position.x=0.5;
  g.add(body,head,armL,armR);
  const a=Math.random()*Math.PI*2, r=45+Math.random()*20;
  g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  scene.add(g);
  zombies.push({mesh:g,hp:100,dead:false,speed:2.2+Math.random()*1.8,attackCd:0,phase:Math.random()*10});
}
function killZombie(z){z.dead=true;scene.remove(z.mesh);score+=10;}
// waves
let wave=0,score=0,spawnTimer=0,toSpawn=0;
function nextWave(){wave++;toSpawn=4+wave*3;spawnTimer=0;}
// damage / death
const msg=document.getElementById('msg');
function hurt(dmg){
  if(P.dead)return;
  P.hp-=dmg;
  document.body.style.filter='brightness(1.4)';
  setTimeout(()=>document.body.style.filter='',80);
  if(P.hp<=0){P.dead=true;msg.textContent='YOU DIED — SCORE '+score;msg.style.display='block';document.exitPointerLock();}
}
function respawn(){
  Object.assign(P,{hp:100,ammo:12,reserve:60,dead:false});
  P.pos.set(0,0,0);
  zombies.forEach(z=>scene.remove(z.mesh)); zombies.length=0;
  wave=0;score=0; msg.style.display='none';
  nextWave(); renderer.domElement.requestPointerLock();
}
// main loop
nextWave();
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  if(!P.dead){
    // movement + collision
    const speed=(keys['ShiftLeft']||keys['ShiftRight'])?9:5;
    const f=new THREE.Vector3(-Math.sin(P.yaw),0,-Math.cos(P.yaw));
    const r=new THREE.Vector3(f.z,0,-f.x), mv=new THREE.Vector3();
    if(keys['KeyW'])mv.add(f); if(keys['KeyS'])mv.sub(f);
    if(keys['KeyA'])mv.sub(r); if(keys['KeyD'])mv.add(r);
    if(mv.lengthSq()>0)mv.normalize().multiplyScalar(speed*dt);
    P.pos.add(mv);
    P.pos.x=Math.max(-95,Math.min(95,P.pos.x)); P.pos.z=Math.max(-95,Math.min(95,P.pos.z));
    for(const c of crates){
      const dx=P.pos.x-c.position.x,dz=P.pos.z-c.position.z,d=Math.hypot(dx,dz);
      if(d<1.6&&d>0.001){const p=(1.6-d)/d;P.pos.x+=dx*p;P.pos.z+=dz*p;}
    }
    const bob=mv.lengthSq()>0?Math.sin(t*12)*0.05:0;
    cam.position.set(P.pos.x,1.7+bob,P.pos.z);
    cam.rotation.set(0,0,0); cam.rotateY(P.yaw); cam.rotateX(P.pitch);
    gunLight.position.copy(cam.position);
    gun.position.z+=(-0.5-gun.position.z)*dt*10; // recoil recover
    if(flashT>0){flashT-=dt;flash.intensity=12;}else flash.intensity=0;
    // spawn
    if(toSpawn>0){spawnTimer-=dt; if(spawnTimer<=0){spawnZombie();toSpawn--;spawnTimer=1.2;}}
    // zombies chase
    for(const z of zombies){
      if(z.dead)continue;
      const to=P.pos.clone().sub(z.mesh.position); to.y=0;
      const dist=to.length(); to.normalize();
      z.mesh.rotation.y=Math.atan2(to.x,to.z);
      z.mesh.position.y=Math.abs(Math.sin(t*6+z.phase))*0.12;
      if(dist>1.2)z.mesh.position.addScaledVector(to,z.speed*dt);
      else{z.attackCd-=dt; if(z.attackCd<=0){hurt(10);z.attackCd=0.9;}}
    }
    if(toSpawn===0&&zombies.every(z=>z.dead)){P.hp=Math.min(100,P.hp+20);nextWave();}
  }
  // tracers fade
  for(let i=tracers.length-1;i>=0;i--){
    tracers[i].life-=dt; tracers[i].l.material.opacity=tracers[i].life/0.08;
    if(tracers[i].life<=0){scene.remove(tracers[i].l);tracers.splice(i,1);}
  }
  document.getElementById('hud').innerHTML=
    'HP '+Math.max(0,Math.round(P.hp))+' · AMMO '+P.ammo+'/'+P.reserve+(P.reloading?' (RELOADING)':'')+
    '<br>WAVE '+wave+' · SCORE '+score;
  renderer.render(scene,cam);
}
loop();
</script></body></html>
