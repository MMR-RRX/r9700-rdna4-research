<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zombie Night</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  #hud { position: fixed; top: 12px; left: 12px; color: #7fff7f; font-size: 20px; font-weight: bold; text-shadow: 0 0 6px #000; pointer-events: none; z-index: 10; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%,-50%); pointer-events: none; z-index: 10; }
  #crosshair::before { content: ''; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: #7fff7f; transform: translateX(-50%); box-shadow: 0 0 4px #000; }
  #crosshair::after { content: ''; position: absolute; top: 50%; left: 0; height: 2px; width: 100%; background: #7fff7f; transform: translateY(-50%); box-shadow: 0 0 4px #000; }
  #msg { position: fixed; left: 0; right: 0; top: 38%; text-align: center; color: #fff; font-size: 44px; font-weight: bold; text-shadow: 0 0 10px #000; display: none; pointer-events: none; z-index: 20; }
  #msg small { display: block; font-size: 20px; margin-top: 14px; color: #cfcfcf; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5; box-shadow: inset 0 0 140px 40px rgba(0,0,0,.85); }
</style>
</head>
<body>
<div id="hud">HEALTH <span id="hp">100</span> &nbsp; KILLS <span id="kills">0</span></div>
<div id="crosshair"></div>
<div id="vignette"></div>
<div id="msg"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c14);
scene.fog = new THREE.Fog(0x0a0c14, 8, 55);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x334466, 0x111122, 0.9));
const moon = new THREE.DirectionalLight(0x8899ff, 0.7);
moon.position.set(-10, 20, 5);
scene.add(moon);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x1c2229, roughness: 1 }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// Ground texture: subtle grid
const c = document.createElement('canvas'); c.width = c.height = 256;
const g = c.getContext('2d');
g.fillStyle = '#1c2229'; g.fillRect(0, 0, 256, 256);
g.strokeStyle = '#242c35'; g.lineWidth = 2;
for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,256); g.stroke(); g.beginPath(); g.moveTo(0,i*64); g.lineTo(256,i*64); g.stroke(); }
const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(60, 60);
floor.material.map = tex; floor.material.needsUpdate = true;

// Rocks for cover
for (let i = 0; i < 30; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4 + Math.random() * 1.2),
    new THREE.MeshStandardMaterial({ color: 0x2a3038, roughness: 1 }));
  const a = Math.random() * Math.PI * 2, d = 12 + Math.random() * 40;
  r.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
  r.rotation.set(Math.random(), Math.random(), Math.random());
  scene.add(r);
}

// ---------- Player ----------
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
let yaw = 0, pitch = 0, locked = false, hp = 100, kills = 0, dead = false;
const vel = new THREE.Vector3();
document.body.addEventListener('click', () => { if (!dead) renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  if (!locked && !dead) showMsg('PAUSED', 'Click to resume');
});
document.addEventListener('mousemove', e => {
  if (!locked || dead) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.0022));
});

// Gun model (simple box + barrel) attached to camera
const gun = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.16, 0.4), new THREE.MeshStandardMaterial({ color: 0x222228 }));
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35), new THREE.MeshStandardMaterial({ color: 0x111114 }));
barrel.rotation.x = Math.PI / 2; barrel.position.z = -0.3;
gun.add(body, barrel);
gun.position.set(0.28, -0.28, -0.5);
camera.add(gun);
scene.add(camera);

// Muzzle flash light
const flash = new THREE.PointLight(0xffcc66, 0, 4);
flash.position.set(0.28, -0.2, -0.8);
camera.add(flash);

// ---------- Zombies ----------
const zombies = [];
const zombieMat = new THREE.MeshStandardMaterial({ color: 0x3d5a3a, roughness: 0.9 });
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff2200, emissiveIntensity: 1.5 });
function makeZombie() {
  const z = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.35), zombieMat);
  torso.position.y = 1.05;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), zombieMat);
  head.position.y = 1.75;
  const e1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.05), eyeMat);
  const e2 = e1.clone();
  e1.position.set(-0.1, 1.78, 0.2); e2.position.set(0.1, 1.78, 0.2);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.25), zombieMat);
  const legR = legL.clone();
  legL.position.set(-0.16, 0.35, 0); legR.position.set(0.16, 0.35, 0);
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.7, 0.18), zombieMat);
  const armR = armL.clone();
  armL.position.set(-0.42, 1.05, 0.25); armR.position.set(0.42, 1.05, 0.25);
  armL.rotation.x = -1.2; armR.rotation.x = -1.2; // arms reaching forward
  z.add(torso, head, e1, e2, legL, legR, armL, armR);
  z.userData = { hp: 3, legL, legR, t: Math.random() * 10, alive: true, hitFlash: 0 };
  return z;
}

function spawnZombie() {
  if (zombies.length >= 24) return;
  const z = makeZombie();
  const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 15;
  z.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
  scene.add(z);
  zombies.push(z);
}

function killZombie(z) {
  z.userData.alive = false;
  kills++;
  document.getElementById('kills').textContent = kills;
  scene.remove(z);
}

// ---------- Shooting ----------
const ray = new THREE.Raycaster();
let ammo = 8, reloading = false;
function shoot() {
  if (dead || reloading) return;
  if (ammo <= 0) { reload(); return; }
  ammo--;
  flash.intensity = 3;
  // Recoil
  gun.position.z = -0.42;
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const targets = zombies.filter(z => z.userData.alive);
  const hits = ray.intersectObjects(targets, true);
  if (hits.length) {
    let o = hits[0].object;
    while (o.parent && !o.parent.isGroup) o = o.parent;
    const z = o.parent || o;
    z.userData.hp--;
    z.userData.hitFlash = 0.12;
    if (z.userData.hp <= 0) killZombie(z);
  }
  if (ammo === 0) reload();
}
function reload() {
  if (reloading || dead) return;
  reloading = true;
  showMsg('RELOADING', '', 1.8);
  setTimeout(() => { ammo = 8; reloading = false; }, 1500);
}
addEventListener('mousedown', e => { if (locked && e.button === 0) shoot(); });
addEventListener('keydown', e => { if (e.code === 'KeyR') reload(); });

// ---------- UI ----------
function showMsg(a, b, secs) {
  const m = document.getElementById('msg');
  m.innerHTML = a + (b ? `<small>${b}</small>` : '');
  m.style.display = 'block';
  if (secs) setTimeout(() => m.style.display = 'none', secs * 1000);
}
document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && !dead) showMsg('PAUSED', 'Click to resume');
});

function setHp(v) {
  hp = Math.max(0, Math.min(100, v));
  document.getElementById('hp').textContent = hp;
  if (hp <= 0 && !dead) {
    dead = true;
    document.exitPointerLock();
    showMsg('YOU DIED', `Kills: ${kills} — Click to restart`, 0);
  }
}
document.addEventListener('click', () => {
  if (dead) location.reload();
});

// ---------- Loop ----------
const clock = new THREE.Clock();
let spawnTimer = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!dead && locked) {
    // Movement
    const speed = keys['ShiftLeft'] ? 11 : 6;
    const dir = new THREE.Vector3(
      (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0), 0,
      (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0));
    if (dir.lengthSq() > 0) dir.normalize();
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
    camera.position.addScaledVector(dir, speed * dt);
    // Keep in bounds
    const d = Math.hypot(camera.position.x, camera.position.z);
    if (d > 55) { camera.position.x *= 55 / d; camera.position.z *= 55 / d; }
    camera.rotation.set(pitch, yaw, 0, 'YXZ');

    // Spawning
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnZombie(); spawnTimer = Math.max(0.8, 3 - kills * 0.05); }

    // Muzzle flash decay + gun recoil reset
    flash.intensity = Math.max(0, flash.intensity - dt * 12);
    gun.position.z = Math.min(-0.5, gun.position.z + dt * 2);
  }

  // Zombies chase
  for (const z of zombies) {
    if (!z.userData.alive) continue;
    const u = z.userData;
    const toP = new THREE.Vector3().subVectors(camera.position, z.position);
    toP.y = 0;
    const dist = toP.length();
    toP.normalize();
    z.lookAt(camera.position.x, 0, camera.position.z);
    const zspeed = 2.2 + Math.min(2, kills * 0.04);
    if (dist > 1.4) z.position.addScaledVector(toP, zspeed * dt);
    // Walking anim
    u.t += dt * zspeed * 2;
    u.legL.rotation.x = Math.sin(u.t) * 0.7;
    u.legR.rotation.x = -Math.sin(u.t) * 0.7;
    // Hit flash
    if (u.hitFlash > 0) { u.hitFlash -= dt; zombieMat.emissive.set(0x660000); }
    else zombieMat.emissive.set(0x000000);
    // Attack
    if (dist < 1.6) {
      setHp(hp - 12 * dt * 4);
    }
  }
  // Remove dead zombies from array
  for (let i = zombies.length - 1; i >= 0; i--) if (!zombies[i].userData.alive) zombies.splice(i, 1);

  renderer.render(scene, camera);
}
animate();
showMsg('ZOMBIE NIGHT', 'Click to play — WASD move, mouse aim, click shoot, R reload, Shift sprint', 0);
</script>
</body>
</html>
